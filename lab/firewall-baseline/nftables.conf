#!/usr/bin/nft -f

# FireNet-AI - Configuración Base de nftables (Línea Base Estática)
# Conforme a docs/ROADMAP.md (Fase 1 / Fase 3)

flush ruleset

table inet firenet {
    # Cadena para tráfico dirigido al propio Gateway
    chain input {
        type filter hook input priority 0; policy accept;
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    # Cadena principal de reenvío
    chain forward {
        type filter hook forward priority 0; policy accept;

        # Permitir tráfico ICMP/ICMPv6 de diagnóstico
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Salto a la cadena donde FireNet-AI aplicará reglas adaptativas dinámicas
        jump dynamic_rules
    }

    # Cadena dedicada para reglas dinámicas generadas por la IA
    chain dynamic_rules {
        # Inicialmente vacía. El NftExecutor agregará reglas dinámicas aquí.
    }
}
