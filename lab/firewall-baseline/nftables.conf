#!/usr/bin/nft -f

flush ruleset

table inet firenet_table {
    # Cadena estática principal (Línea Base)
    chain base_forward {
        type filter hook forward priority filter; policy accept;

        # Permitir tráfico ICMP/ICMPv6 esencial
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Salto a la cadena donde el script de IA agregará bloqueos dinámicos
        jump dynamic_rules
    }

    # Cadena dedicada para reglas dinámicas creadas por FireNet-AI
    chain dynamic_rules {
        # Inicialmente vacía. El ejecutor añadirá reglas aquí con TTL y comentarios (rule_id)
    }
}